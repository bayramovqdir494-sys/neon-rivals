<style>@font-face{font-family:"Russo One";src:url(fonts/RussoOne-Regular.ttf) format("truetype");font-weight:400;font-display:swap}
@font-face{font-family:"Chakra Petch";src:url(fonts/ChakraPetch-Medium.ttf) format("truetype");font-weight:500;font-display:swap}
@font-face{font-family:"Chakra Petch";src:url(fonts/ChakraPetch-SemiBold.ttf) format("truetype");font-weight:600;font-display:swap}
@font-face{font-family:"Chakra Petch";src:url(fonts/ChakraPetch-Bold.ttf) format("truetype");font-weight:700;font-display:swap}

<style>
/* Layout: full-bleed WebGL race; race info top-left, weapon slots top-centre, map top-right; touch pads along the bottom edge; menus as left-anchored panels over the live city. */
:root{
  --ink:#06050c; --panel:rgba(12,10,24,.82); --panel-2:#151127; --line:#2c2546; --line-2:#463b6e;
  --text:#eef2ff; --mute:#8e89ad; --cyan:#29f0ff; --pink:#ff2fa8; --amber:#ffb02e; --lime:#3fff8a; --red:#ff3355; --violet:#9b6bff;
  --f-display:"Russo One","Arial Black","Segoe UI Black",system-ui,sans-serif;
  --f-ui:"Chakra Petch","Bahnschrift","Segoe UI",system-ui,sans-serif;
  color-scheme:dark;
}
[hidden]{display:none!important}
html,body{height:100%;margin:0;background:var(--ink);color:var(--text);overflow:hidden;touch-action:none;-webkit-user-select:none;user-select:none;-webkit-tap-highlight-color:transparent}
body{font-family:var(--f-ui)}
#app{position:fixed;inset:0;overflow:hidden;background:var(--ink)}
#gl,#ov{position:absolute;inset:0;width:100%;height:100%;display:block}
#ov{pointer-events:none}
button{font-family:var(--f-ui);cursor:pointer;border:0;color:inherit;background:none;padding:0}
button:focus-visible{outline:2px solid var(--cyan);outline-offset:3px}
.tnum{font-variant-numeric:tabular-nums}

/* ---------- race HUD ---------- */
#hud{position:absolute;inset:0;pointer-events:none}
.tl{position:absolute;left:0;top:0;padding:calc(10px + env(safe-area-inset-top,0px)) 26px 10px max(16px,env(safe-area-inset-left,0px));display:flex;flex-direction:column;gap:7px;background:linear-gradient(90deg,rgba(6,5,12,.62) 0%,rgba(6,5,12,.38) 70%,rgba(6,5,12,0) 100%)}
.posrow{display:flex;align-items:flex-end;gap:10px}
.pos{font-family:var(--f-display);font-size:64px;line-height:.8;color:var(--text);text-shadow:3px 0 0 rgba(255,47,168,.75),-3px 0 0 rgba(41,240,255,.75)}
.pos sup{font-size:.36em;vertical-align:top;position:relative;top:.1em;margin-left:2px}
.of{font-size:18px;color:var(--mute);font-weight:700;padding-bottom:4px}
.laprow{display:flex;gap:14px;font-weight:700;font-size:15px;letter-spacing:.06em}
.laprow b{font-family:var(--f-display);font-weight:400;font-size:20px;color:var(--text);letter-spacing:0}
.laprow span{color:var(--mute)}
.hp{width:min(230px,38vw);height:9px;background:rgba(6,5,12,.75);border:1px solid var(--line-2);transform:skewX(-18deg);overflow:hidden}
.hp i{display:block;height:100%;width:100%;background:linear-gradient(90deg,var(--lime),#b6ff3f);transform-origin:left;transition:transform .12s}
.hp.mid i{background:linear-gradient(90deg,var(--amber),#ffd23f)}
.hp.low i{background:linear-gradient(90deg,var(--red),#ff6a2f);animation:blink .4s steps(2) infinite}
@keyframes blink{50%{opacity:.45}}
.tc{position:absolute;left:50%;transform:translateX(-50%);top:calc(10px + env(safe-area-inset-top,0px));display:flex;flex-direction:column;align-items:center;gap:8px;width:min(520px,60vw)}
.slots{display:flex;gap:8px;align-items:center;pointer-events:auto}
.slot{width:54px;height:54px;background:rgba(8,6,16,.8);border:1px solid var(--line-2);display:grid;place-items:center;position:relative;transform:skewX(-10deg)}
.slot img{width:40px;height:40px;transform:skewX(10deg)}
.slot.main{width:68px;height:68px;border-color:var(--cyan);box-shadow:0 0 16px -4px var(--cyan)}
.slot.main img{width:52px;height:52px}
.slot .n{position:absolute;right:4px;bottom:1px;font-size:12px;font-weight:700;transform:skewX(10deg)}
.slot .k{position:absolute;left:4px;top:1px;font-size:10px;color:var(--mute);font-weight:700;letter-spacing:.06em;transform:skewX(10deg)}
.slot.empty{opacity:.35}
.itemname{font-size:13px;font-weight:700;letter-spacing:.14em;color:var(--mute);min-height:16px;text-transform:uppercase;text-align:center;text-shadow:0 1px 6px #000}.itemname b{color:var(--text)}
#feed{position:absolute;left:50%;transform:translateX(-50%);top:calc(124px + env(safe-area-inset-top,0px));display:flex;flex-direction:column;align-items:center;gap:4px;max-width:90vw;pointer-events:none}
.fd{font-weight:700;font-size:16px;letter-spacing:.08em;padding:3px 12px;background:rgba(8,6,16,.7);border-left:3px solid var(--cyan);animation:fdin .25s ease-out both, fdout .4s ease-in 2.2s forwards;white-space:nowrap}
.fd.good{border-color:var(--lime);color:#d9ffe6}.fd.bad{border-color:var(--red);color:#ffd5dc}.fd.item{border-color:var(--amber)}
@keyframes fdin{from{opacity:0;transform:translateY(-6px)}}
@keyframes fdout{to{opacity:0;transform:translateY(-4px)}}
#warn{font-family:var(--f-display);font-size:20px;color:#fff;background:var(--red);padding:4px 14px;letter-spacing:.08em;animation:blink .3s steps(2) infinite}
.tr{position:absolute;right:max(14px,env(safe-area-inset-right,0px));top:calc(10px + env(safe-area-inset-top,0px));display:flex;flex-direction:column;align-items:flex-end;gap:6px}
#mapbox{width:150px;height:150px}
.spd{display:flex;align-items:baseline;gap:6px}
.spd b{font-family:var(--f-display);font-weight:400;font-size:32px;line-height:1;text-shadow:0 2px 8px rgba(0,0,0,.7)}
.spd span{font-size:12px;font-weight:700;color:var(--mute);letter-spacing:.1em}
#pauseBtn{pointer-events:auto;width:40px;height:40px;background:rgba(8,6,16,.75);border:1px solid var(--line-2);display:grid;place-items:center}
#pauseBtn svg{width:14px;height:14px;fill:var(--text)}
#center{position:absolute;left:0;right:0;top:30%;text-align:center;pointer-events:none}
.big{font-family:var(--f-display);font-size:clamp(56px,11vw,140px);line-height:1;color:#fff;text-shadow:5px 0 0 rgba(255,47,168,.8),-5px 0 0 rgba(41,240,255,.8);animation:pop .9s cubic-bezier(.2,1.4,.4,1) both}
.big.final{color:var(--amber)}.big.win{color:var(--lime)}.big.lap{font-size:clamp(40px,7vw,84px)}
.big.go{color:var(--lime)}
@keyframes pop{0%{transform:scale(1.8);opacity:0}25%{transform:scale(1);opacity:1}80%{opacity:1}100%{opacity:0;transform:scale(.96)}}
#wrong{position:absolute;left:50%;top:22%;transform:translateX(-50%);font-family:var(--f-display);font-size:34px;color:var(--red);text-shadow:0 0 18px rgba(255,51,85,.6)}
#hint{position:absolute;left:50%;bottom:calc(22px + env(safe-area-inset-bottom,0px));transform:translateX(-50%);font-size:15px;font-weight:600;background:rgba(8,6,16,.8);border:1px solid var(--line-2);border-radius:999px;padding:7px 18px;white-space:nowrap;transition:opacity .4s;text-align:center}
#hint b{color:var(--cyan)}

/* ---------- touch controls ---------- */
#touch{position:absolute;inset:0;pointer-events:none}
#steer{position:absolute;left:max(14px,env(safe-area-inset-left,0px));bottom:calc(18px + env(safe-area-inset-bottom,0px));width:min(244px,44vw);height:88px;border-radius:44px;pointer-events:auto;touch-action:none;
  background:linear-gradient(180deg,rgba(24,18,48,.62),rgba(8,6,18,.62));border:1.5px solid rgba(255,255,255,.2);box-shadow:inset 0 0 22px rgba(155,107,255,.18),0 6px 18px rgba(0,0,0,.35)}
#steer .ch{position:absolute;top:50%;width:34px;height:34px;margin-top:-17px;fill:none;stroke:#fff;stroke-width:2.6;stroke-linecap:round;stroke-linejoin:round;opacity:.55;transition:opacity .08s,stroke .08s,transform .08s}
#steer .ch.l{left:22px}#steer .ch.r{right:22px}
#steer .ch.hot{opacity:1;stroke:var(--cyan);filter:drop-shadow(0 0 6px var(--cyan))}
#steer .mid{position:absolute;left:50%;top:18px;bottom:18px;width:2px;margin-left:-1px;background:rgba(255,255,255,.14)}
#steer .knob{position:absolute;top:50%;left:50%;width:52px;height:52px;margin:-26px 0 0 -26px;border-radius:50%;background:radial-gradient(circle at 35% 30%,rgba(255,255,255,.55),rgba(41,240,255,.32) 55%,rgba(41,240,255,.12));border:1.5px solid rgba(41,240,255,.8);box-shadow:0 0 14px rgba(41,240,255,.45);transform:translateX(0);will-change:transform}
#steer.on{border-color:rgba(41,240,255,.6)}
#tCl{position:absolute;right:max(14px,env(safe-area-inset-right,0px));bottom:calc(18px + env(safe-area-inset-bottom,0px));width:196px;height:172px;pointer-events:none;transform-origin:100% 100%}
.tb{position:absolute;pointer-events:auto;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:1px;border-radius:50%;border:2px solid rgba(255,255,255,.24);
  background:radial-gradient(circle at 35% 28%,rgba(255,255,255,.2),rgba(18,14,36,.62) 62%);color:#fff;font-weight:700;font-size:10px;letter-spacing:.12em;touch-action:none;box-shadow:0 6px 16px rgba(0,0,0,.4),inset 0 0 16px rgba(255,255,255,.05);transition:transform .06s,background .08s,border-color .08s}
.tb svg{width:50%;height:50%;fill:none;stroke:#fff;stroke-width:2.2;stroke-linecap:round;stroke-linejoin:round}
.tb span{opacity:.85;line-height:1}
.tb.on{transform:scale(.92);background:radial-gradient(circle at 35% 28%,rgba(255,255,255,.4),rgba(41,240,255,.3) 62%);border-color:var(--cyan);box-shadow:0 0 18px rgba(41,240,255,.5)}
#tFire{right:0;bottom:0;width:98px;height:98px;border-color:var(--pink);background:radial-gradient(circle at 35% 28%,rgba(255,255,255,.28),rgba(255,47,168,.4) 66%);font-size:11px}
#tFire svg{stroke:#fff;filter:drop-shadow(0 0 5px rgba(255,47,168,.9))}
#tFire.on{background:radial-gradient(circle at 35% 28%,rgba(255,255,255,.55),rgba(255,47,168,.7) 66%);border-color:#fff;box-shadow:0 0 24px rgba(255,47,168,.8)}
#tDrift{right:110px;bottom:2px;width:72px;height:72px;border-color:rgba(255,176,46,.8)}
#tDrift svg{stroke:var(--amber)}
#tDrift.on{background:radial-gradient(circle at 35% 28%,rgba(255,255,255,.4),rgba(255,176,46,.4) 62%);border-color:var(--amber);box-shadow:0 0 18px rgba(255,176,46,.55)}
#tBack{right:76px;bottom:104px;width:58px;height:58px}
#tBrake{right:2px;bottom:112px;width:60px;height:60px;border-color:rgba(255,51,85,.7)}
#tBrake svg{stroke:#ff6b82}
#tBrake.on{background:radial-gradient(circle at 35% 28%,rgba(255,255,255,.4),rgba(255,51,85,.45) 62%);border-color:var(--red);box-shadow:0 0 18px rgba(255,51,85,.55)}

/* ---------- screens ---------- */
.screen{position:absolute;inset:0;display:flex;flex-direction:column;justify-content:center;padding-block:calc(24px + env(safe-area-inset-top,0px)) calc(24px + env(safe-area-inset-bottom,0px));padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));box-sizing:border-box}
#menu{background:linear-gradient(90deg,rgba(6,5,12,.92) 0%,rgba(6,5,12,.55) 38%,rgba(6,5,12,0) 62%);align-items:flex-start;gap:20px;padding-left:max(7vw,env(safe-area-inset-left,0px))}
.logo{font-family:var(--f-display);font-weight:400;font-size:clamp(52px,9vw,124px);line-height:.84;margin:0;letter-spacing:-.01em;color:#fff;text-shadow:6px 0 0 rgba(255,47,168,.85),-6px 0 0 rgba(41,240,255,.85),0 0 60px rgba(155,107,255,.45)}
.logo small{display:block;font-family:var(--f-ui);font-weight:700;font-size:clamp(14px,1.6vw,20px);letter-spacing:.42em;text-shadow:none;color:var(--cyan);margin-top:.9em}
.btnrow{display:flex;gap:12px;flex-wrap:wrap}
.btn{font-family:var(--f-display);font-size:20px;letter-spacing:.06em;padding:14px 30px;background:var(--panel-2);border:1.5px solid var(--line-2);color:var(--text);clip-path:polygon(10px 0,100% 0,calc(100% - 10px) 100%,0 100%);transition:transform .08s,background .15s,border-color .15s}
.btn:hover{border-color:var(--cyan);transform:translateY(-1px)}
.btn.primary{background:linear-gradient(90deg,var(--pink),#ff5d6c);border-color:transparent;color:#fff;padding:16px 42px;font-size:24px}
.btn.primary:hover{filter:brightness(1.08)}
.btn.small{font-size:15px;padding:10px 20px}
.meta{display:flex;gap:26px}
.meta div{font-size:12px;font-weight:700;letter-spacing:.16em;color:var(--mute);text-transform:uppercase}
.meta b{display:block;font-family:var(--f-display);font-weight:400;font-size:26px;color:var(--text);letter-spacing:0;margin-top:2px}
.prof{display:flex;align-items:center;gap:12px;width:min(380px,90vw)}
.lvb{width:54px;height:54px;flex:none;display:grid;place-items:center;align-content:center;background:linear-gradient(135deg,var(--pink),var(--violet));clip-path:polygon(50% 0,100% 25%,100% 75%,50% 100%,0 75%,0 25%);line-height:1}
.lvb span{font-size:10px;font-weight:700;letter-spacing:.14em;opacity:.85}.lvb b{font-family:var(--f-display);font-weight:400;font-size:22px}
.xpw{flex:1;display:flex;flex-direction:column;gap:5px}
.xpt{display:flex;justify-content:space-between;font-size:11px;font-weight:700;letter-spacing:.14em;color:var(--mute)}
.xpb{height:8px;background:rgba(6,5,12,.75);border:1px solid var(--line-2);transform:skewX(-18deg);overflow:hidden}
.xpb i{display:block;height:100%;width:0;background:linear-gradient(90deg,var(--cyan),var(--violet));transition:width .8s cubic-bezier(.2,.8,.2,1)}
.cash{color:var(--amber)!important}
.ghead{display:flex;align-items:center;gap:16px;flex-wrap:wrap}
.wallet{font-family:var(--f-display);font-size:20px;color:var(--amber);background:rgba(8,6,16,.7);border:1px solid rgba(255,176,46,.4);padding:4px 12px;transform:skewX(-10deg)}
.tabs{display:flex;gap:8px;flex-wrap:wrap}
.tab{position:relative;padding:9px 16px 8px;background:var(--panel);border:1.5px solid var(--line);text-align:left;display:flex;flex-direction:column;gap:2px;min-width:118px;transition:border-color .15s}
.tab b{font-family:var(--f-display);font-weight:400;font-size:16px}.tab span{font-size:11px;font-weight:700;letter-spacing:.1em;color:var(--mute)}
.tab.sel{border-color:var(--tc,var(--cyan));box-shadow:0 0 16px -6px var(--tc,var(--cyan))}
.tab.locked{opacity:.5}
.stars{display:inline-flex;gap:2px;font-size:15px;letter-spacing:0;color:var(--line-2)}.stars i{font-style:normal}.stars i.on{color:#ffd23f;text-shadow:0 0 8px rgba(255,210,63,.6)}
.mtag{color:#06050c!important;border:0!important;font-weight:800!important}
.ev .rw{font-size:12px;font-weight:700;color:var(--amber)}
.ev .foot{display:flex;justify-content:space-between;align-items:center;margin-top:auto;gap:6px}
.cstrip{display:flex;gap:8px;overflow-x:auto;max-width:min(760px,100%);padding-bottom:6px;scrollbar-width:thin;scroll-snap-type:x proximity}
.cchip{flex:none;width:118px;padding:8px 10px;background:var(--panel);border:1.5px solid var(--line);text-align:left;display:flex;flex-direction:column;gap:3px;scroll-snap-align:start;transition:border-color .15s}
.cchip b{font-family:var(--f-display);font-weight:400;font-size:15px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.cchip span{font-size:11px;font-weight:700;letter-spacing:.06em;color:var(--mute);white-space:nowrap}
.cchip .st{color:var(--lime)}.cchip .st.buy{color:var(--amber)}.cchip .st.lock{color:var(--mute)}
.cchip.view{border-color:var(--pink)}.cchip.sel{border-color:var(--cyan);box-shadow:0 0 14px -6px var(--cyan)}.cchip.locked{opacity:.55}
.cdet{background:var(--panel);border:1.5px solid var(--line);padding:12px 14px;display:flex;flex-direction:column;gap:8px;width:min(520px,100%);box-sizing:border-box}
.cdet .hd{display:flex;align-items:baseline;gap:10px;flex-wrap:wrap}.cdet h3{margin:0;font-family:var(--f-display);font-weight:400;font-size:24px}.cdet .cls{font-size:12px;color:var(--mute);font-weight:700;letter-spacing:.1em;text-transform:uppercase}
.urow{display:grid;grid-template-columns:76px 1fr 92px;align-items:center;gap:10px;font-size:11px;font-weight:700;letter-spacing:.08em;color:var(--mute)}
.ubar{height:9px;background:rgba(6,5,12,.8);border:1px solid var(--line-2);position:relative;overflow:hidden;transform:skewX(-14deg)}
.ubar i{position:absolute;top:0;bottom:0;left:0;background:var(--cyan)}.ubar i.u{background:var(--pink)}
.ubar em{position:absolute;top:0;bottom:0;width:1px;background:rgba(6,5,12,.9)}
.ubtn{font-size:12px;font-weight:700;padding:6px 6px;border:1.5px solid rgba(255,176,46,.6);color:var(--amber);background:rgba(255,176,46,.08);letter-spacing:.04em}
.ubtn:disabled{opacity:.4;cursor:default}
.ubtn.max{border-color:var(--line-2);color:var(--mute)}
.cdet .act{display:flex;gap:10px;align-items:center;flex-wrap:wrap;margin-top:2px}
.cdet .note{font-size:12px;font-weight:700;color:var(--mute);letter-spacing:.06em}
.rstars{display:flex;gap:10px;font-size:44px;line-height:1}
.rstars i{font-style:normal;color:var(--line-2);transform:scale(.4);opacity:0;animation:starin .5s cubic-bezier(.2,1.6,.4,1) forwards}
.rstars i.on{color:#ffd23f;text-shadow:0 0 18px rgba(255,210,63,.7)}
@keyframes starin{to{transform:scale(1);opacity:1}}
.rew{display:flex;flex-direction:column;gap:6px;width:min(520px,100%)}
.rew .line{display:flex;justify-content:space-between;font-size:14px;font-weight:700;letter-spacing:.06em;color:var(--mute);border-bottom:1px solid var(--line);padding:3px 0}
.rew .line b{color:var(--text)}.rew .line b.c{color:var(--amber)}.rew .line b.x{color:var(--cyan)}
.rew .lvup{font-family:var(--f-display);font-size:22px;color:var(--lime);text-shadow:0 0 14px rgba(63,255,138,.5)}
.rew .unl{font-size:13px;font-weight:700;color:var(--amber);letter-spacing:.06em}
.modebox{font-size:14px;font-weight:700;letter-spacing:.08em;padding:4px 10px;background:rgba(8,6,16,.75);border-left:3px solid var(--amber);width:max-content}
.modebox b{font-family:var(--f-display);font-weight:400;font-size:18px;color:var(--text);margin-left:6px}
.modebox.danger{border-color:var(--red);background:rgba(255,51,85,.25);animation:blink .5s steps(2) infinite}
#toast{position:absolute;left:50%;top:calc(18px + env(safe-area-inset-top,0px));transform:translateX(-50%);z-index:20;background:linear-gradient(90deg,rgba(255,176,46,.95),rgba(255,47,168,.95));color:#fff;font-weight:700;font-size:16px;letter-spacing:.06em;padding:10px 20px;box-shadow:0 8px 30px rgba(0,0,0,.45);animation:fdin .3s ease-out both;text-align:center;width:max-content;max-width:min(420px,88vw);box-sizing:border-box;cursor:pointer}
#toast b{font-family:var(--f-display);font-weight:400;font-size:22px;display:block}
.controls{max-width:440px;font-size:14px;line-height:1.55;color:var(--mute)}
.controls b{color:var(--text);font-weight:700}
#credit{position:absolute;right:max(16px,env(safe-area-inset-right,0px));bottom:calc(12px + env(safe-area-inset-bottom,0px));font-size:11px;color:var(--mute);opacity:.8;text-align:right;max-width:60vw}
#muteBtn{position:absolute;right:max(16px,env(safe-area-inset-right,0px));top:calc(14px + env(safe-area-inset-top,0px));width:42px;height:42px;background:rgba(8,6,16,.7);border:1px solid var(--line-2);display:grid;place-items:center;pointer-events:auto;z-index:5}
#muteBtn svg{width:20px;height:20px;fill:none;stroke:var(--text);stroke-width:2;stroke-linecap:round;stroke-linejoin:round}

<script type="module">
import * as THREE from 'three';
import { GLTFLoader } from 'three/addons/loaders/GLTFLoader.js';
import * as BufferGeometryUtils from 'three/addons/utils/BufferGeometryUtils.js';
'use strict';
// ================================================================
//  NEON RIVALS — core: math, storage, SDK, synthesized audio + music, input
// ================================================================
const TAU = Math.PI * 2;
const clamp = (v, a, b) => (v < a ? a : v > b ? b : v);
const lerp = (a, b, t) => a + (b - a) * t;
const rand = (a, b) => a + Math.random() * (b - a);
const randi = (a, b) => Math.floor(a + Math.random() * (b - a + 1));
const pick = (arr) => arr[(Math.random() * arr.length) | 0];
const damp = (a, b, k, dt) => lerp(a, b, 1 - Math.exp(-k * dt));
const nowS = () => performance.now() / 1000;
const smooth = (t) => t * t * (3 - 2 * t);
function angDiff(a, b) { let d = (b - a) % TAU; if (d > Math.PI) d -= TAU; else if (d < -Math.PI) d += TAU; return d; }
const lerpAng = (a, b, t) => a + angDiff(a, b) * t;
const V3 = THREE.Vector3;
const _v1 = new V3(), _v2 = new V3(), _v3 = new V3(), _v4 = new V3();
const $ = (id) => document.getElementById(id);
// deterministic hash/noise for scenery
function hash1(n) { const s = Math.sin(n * 127.1 + 311.7) * 43758.5453; return s - Math.floor(s); }
function mulberry(seed) { let a = seed >>> 0; return () => { a |= 0; a = a + 0x6D2B79F5 | 0; let t = Math.imul(a ^ a >>> 15, 1 | a); t = t + Math.imul(t ^ t >>> 7, 61 | t) ^ t; return ((t ^ t >>> 14) >>> 0) / 4294967296; }; }

// progress lives in the CrazyGames data module when it is there (cloud save for signed-in players), else localStorage
const Store = {
  be() { try { if (typeof CG !== 'undefined' && CG.sdk && CG.sdk.data) return CG.sdk.data; } catch (e) { } return localStorage; },
  get(k, d) { try { const v = this.be().getItem('neonrivals_' + k); return v == null ? d : JSON.parse(v); } catch (e) { return d; } },
  set(k, v) { try { this.be().setItem('neonrivals_' + k, JSON.stringify(v)); } catch (e) { } },
};

const IS_TOUCH = (() => {
  try { return matchMedia('(pointer: coarse)').matches || ('ontouchstart' in window && navigator.maxTouchPoints > 0); } catch (e) { return false; }
})();

// ---------------------------------------------------------------- CrazyGames SDK (safe no-op outside the portal)
const CG = {
  sdk: null, inGame: false,
  async init() {
    try {
      if (window.CrazyGames && window.CrazyGames.SDK) { this.sdk = window.CrazyGames.SDK; await this.sdk.init(); }
    } catch (e) { this.sdk = null; }
  },
  loadingStart() { try { this.sdk && this.sdk.game.loadingStart(); } catch (e) { } },
  loadingStop() { try { this.sdk && this.sdk.game.loadingStop(); } catch (e) { } },
  start() { if (this.inGame) return; this.inGame = true; try { this.sdk && this.sdk.game.gameplayStart(); } catch (e) { } },
  stop() { if (!this.inGame) return; this.inGame = false; try { this.sdk && this.sdk.game.gameplayStop(); } catch (e) { } },
  happy() { try { this.sdk && this.sdk.game.happytime(); } catch (e) { } },
  midgame(done) {
    let called = false; const fin = () => { if (called) return; called = true; Sound.duck(false); done(); };
    if (!this.sdk) return fin();
    try {
      this.sdk.ad.requestAd('midgame', { adStarted: () => Sound.duck(true), adFinished: fin, adError: fin });
      setTimeout(fin, 45000);
    } catch (e) { fin(); }
  },
};

// ---------------------------------------------------------------- Audio (all synthesized, no files)
const Sound = (() => {
  let ctx = null, master, sfx, mus, comp, noiseBuf, eng = null, skid = null, rival = null;
  let muted = Store.get('muted', false);
  const last = {};
  function init() {
    if (ctx) { if (ctx.state === 'suspended') ctx.resume(); return; }
    try { ctx = new (window.AudioContext || window.webkitAudioContext)(); } catch (e) { ctx = null; return; }
    comp = ctx.createDynamicsCompressor();
    comp.threshold.value = -14; comp.knee.value = 10; comp.ratio.value = 4; comp.attack.value = 0.003; comp.release.value = 0.2;
    master = ctx.createGain(); master.gain.value = muted ? 0 : 0.8;
    comp.connect(master); master.connect(ctx.destination);
    sfx = ctx.createGain(); sfx.gain.value = 0.85; sfx.connect(comp);
    mus = ctx.createGain(); mus.gain.value = 0.32; mus.connect(comp);
    const len = Math.floor(ctx.sampleRate * 2);
    noiseBuf = ctx.createBuffer(1, len, ctx.sampleRate);
    const d = noiseBuf.getChannelData(0);
    for (let i = 0; i < len; i++) d[i] = Math.random() * 2 - 1;
    Music.start();
  }
  function gate(name, ms) { const t = performance.now(); if (last[name] && t - last[name] < ms) return false; last[name] = t; return true; }
  function env(g, t, gain, attack, dur) {
    g.gain.setValueAtTime(0.0001, t);
    g.gain.exponentialRampToValueAtTime(Math.max(0.0002, gain), t + attack);
    g.gain.exponentialRampToValueAtTime(0.0001, t + dur);
  }
  function noise(dur, o = {}) {
    if (!ctx) return;
    const t = ctx.currentTime + (o.at || 0);
    const src = ctx.createBufferSource(); src.buffer = noiseBuf;
    const f = ctx.createBiquadFilter(); f.type = o.type || 'bandpass';
    const f0 = o.f0 || 1000, f1 = o.f1 || f0;
    f.frequency.setValueAtTime(f0, t); if (f1 !== f0) f.frequency.exponentialRampToValueAtTime(Math.max(30, f1), t + dur);
    f.Q.value = o.q || 1;
    const g = ctx.createGain(); env(g, t, o.gain || 0.4, o.attack || 0.004, dur);
    src.connect(f); f.connect(g); g.connect(o.dest || sfx);
    src.start(t, Math.random() * 0.4); src.stop(t + dur + 0.05);
  }
  function tone(dur, o = {}) {
    if (!ctx) return;
    const t = ctx.currentTime + (o.at || 0);
    const osc = ctx.createOscillator(); osc.type = o.type || 'sine';
    const f0 = o.f0 || 440, f1 = o.f1 || f0;
    osc.frequency.setValueAtTime(f0, t); if (f1 !== f0) osc.frequency.exponentialRampToValueAtTime(Math.max(5, f1), t + dur);
    if (o.detune) osc.detune.value = o.detune;
    const g = ctx.createGain(); env(g, t, o.gain || 0.3, o.attack || 0.004, dur);
    let node = osc;
    if (o.lp) { const f = ctx.createBiquadFilter(); f.type = 'lowpass'; f.frequency.value = o.lp; f.Q.value = o.q || 0.7; osc.connect(f); node = f; }
    node.connect(g); g.connect(o.dest || sfx);
    osc.start(t); osc.stop(t + dur + 0.05);
  }
  // ---- continuous layers: player engine, tyre skid, nearest rival
  function makeEngine() {
    const o1 = ctx.createOscillator(), o2 = ctx.createOscillator(), o3 = ctx.createOscillator();
    o1.type = 'sawtooth'; o2.type = 'square'; o3.type = 'sawtooth';
    const sh = ctx.createWaveShaper(); const curve = new Float32Array(256); for (let i = 0; i < 256; i++) { const x = i / 128 - 1; curve[i] = Math.tanh(x * 2.2); } sh.curve = curve;
    const f = ctx.createBiquadFilter(); f.type = 'lowpass'; f.Q.value = 3;
    const g = ctx.createGain(); g.gain.value = 0;
    const ns = ctx.createBufferSource(); ns.buffer = noiseBuf; ns.loop = true;
    const nf = ctx.createBiquadFilter(); nf.type = 'bandpass'; nf.Q.value = 0.7; nf.frequency.value = 900;

      if (!free(x, z, sz * 0.5)) return;

      const L = inst[t]; if (!L.length) continue;

        uniforms: { map: { value: this.makeSigns() }, uTime: GFX.timeU || (GFX.timeU = { value: 0 }) },
        vertexShader: `attribute vec2 aCell; attribute float aPh; varying vec2 vUv; varying float vF; uniform float uTime;
          void main(){ vUv=(uv+aCell)*vec2(.25,.25); float t=uTime*1.7+aPh*40.; vF=.75+.25*sin(t*3.1)*sin(t*1.7); if(fract(aPh*13.)>.82 && fract(t*.37)>.93) vF=.15;

        fragmentShader: 'uniform sampler2D map; varying vec2 vUv; varying float vF; void main(){ vec3 c=texture2D(map,vUv).rgb; gl_FragColor=vec4(c*3.2*vF,1.); }',

    const pin = {}; props.forEach(p => pin[p] = []);
    for (let i = 2; i < N; i += 5) {
      if (rng() < 0.55 || this.tunnelMask[i]) continue;
      const side = rng() < 0.5 ? -1 : 1, isCar = rng() < 0.35;
      const p = isCar ? pick(['car_sedan', 'car_taxi', 'car_hatchback', 'car_stationwagon', 'car_police']) : pick(['dumpster', 'bench', 'firehydrant', 'trash_A', 'box_A', 'bush']);
      const lat = side * (hw + (isCar ? 5.5 : 8.5)), x = this.px[i] + this.rx[i] * lat, z = this.pz[i] + this.rz[i] * lat;

      L.forEach(([x, y, z, r, s], k) => { o.position.set(x, y, z); o.rotation.set(0, r, 0); o.scale.setScalar(s); o.updateMatrix(); im.setMatrixAt(k, o.matrix); });

  buildSkyline() {

      uniforms: Object.assign(THREE.UniformsUtils.merge([THREE.UniformsLib.fog]), { uTime: GFX.timeU || (GFX.timeU = { value: 0 }) }),

  // ---------------------------------------------------------------- sky dome and ground / water

  buildGround() {

      x.fillStyle = this.def.water ? '#000' : '#fff'; x.fillRect(0, 0, M, M);
      if (this.def.water) {
        x.strokeStyle = '#fff'; x.fillStyle = '#fff'; x.lineCap = 'round'; x.lineJoin = 'round'; x.lineWidth = 300 / (x1 - x0) * M;

        #include <fog_vertex>
        }`,
      fragmentShader: `uniform sampler2D uMask; uniform vec4 uBox; uniform vec3 uSky; uniform float uTime; varying vec3 vWP;

  // ---------------------------------------------------------------- minimap path
  buildMinimap() {

// ================================================================
//  Wild environments: Frostbite Pass (night mountains, aurora) and Red Canyon (sunset desert)
//  Terrain heightfield shaped around the track, pine forests, boulders, mesas, a ridge ring on the horizon
// ================================================================
const THEMES = {
  city: { hemi: [0x6a5aa8, 0x120c18, 0.85], moon: [0x9aa6ff, 0.75, [-40, 80, 45]], rim: [0xff4fb0, 0.45], amb: [0.05, 0.045, 0.08], moonC: [0.05, 0.06, 0.11], moonDir: [-0.4, 0.8, 0.45], sky: 0, fogD: 0.0032 },
  mountain: { hemi: [0x5d70b8, 0x0b0f1e, 0.95], moon: [0xb4c2ff, 1.05, [-40, 70, 45]], rim: [0x7a5cff, 0.35], amb: [0.075, 0.085, 0.14], moonC: [0.2, 0.24, 0.4], moonDir: [-0.4, 0.62, 0.45], sky: 1, fogD: 0.0021 },
  canyon: { hemi: [0xffa27a, 0x2a1208, 1.0], moon: [0xffa65a, 1.55, [-80, 26, -62]], rim: [0xff4fb0, 0.3], amb: [0.2, 0.12, 0.13], moonC: [0.85, 0.46, 0.22], moonDir: [-0.74, 0.28, -0.6], sky: 2, fogD: 0.0019 },
};

// value noise / fbm / ridged multifractal, seeded per track
const WNoise = (() => {
  const P = new Uint8Array(512);
  function reseed(s) { const r = mulberry(s); const p = Array.from({ length: 256 }, (_, i) => i); for (let i = 255; i > 0; i--) { const j = (r() * (i + 1)) | 0; const t = p[i]; p[i] = p[j]; p[j] = t; } for (let i = 0; i < 512; i++) P[i] = p[i & 255]; }
  const h = (ix, iz) => P[P[ix & 255] + (iz & 255)] / 255;
  function n2(x, z) { const ix = Math.floor(x), iz = Math.floor(z), fx = x - ix, fz = z - iz, u = fx * fx * (3 - 2 * fx), v = fz * fz * (3 - 2 * fz); const a = h(ix, iz), b = h(ix + 1, iz), c = h(ix, iz + 1), d = h(ix + 1, iz + 1); return a + (b - a) * u + (c - a) * v + (a - b - c + d) * u * v; }
  function fbm(x, z, o = 5) { let s = 0, a = 0.5, f = 1, t = 0; for (let i = 0; i < o; i++) { s += a * n2(x * f + i * 17.3, z * f - i * 9.1); t += a; a *= 0.5; f *= 2.03; } return s / t; }
  function ridged(x, z, o = 5) { let s = 0, a = 0.5, f = 1, t = 0, w = 1; for (let i = 0; i < o; i++) { let n = 1 - Math.abs(n2(x * f + i * 31.7, z * f + i * 11.9) * 2 - 1); n *= n; n *= w; w = clamp(n * 1.7, 0, 1); s += a * n; t += a; a *= 0.5; f *= 2.1; } return s / t; }
  reseed(1);
  return { reseed, n2, fbm, ridged };
})();
const sst = (a, b, x) => { const t = clamp((x - a) / (b - a), 0, 1); return t * t * (3 - 2 * t); };

const TERRAIN_VS = `attribute vec3 aLight; attribute vec3 aAlb; varying vec3 vLight; varying vec3 vAlb; varying vec3 vN; varying vec3 vWP;
#include <fog_pars_vertex>
void main(){ vLight=aLight; vAlb=aAlb; vN=normalize(mat3(modelMatrix)*normal); vec4 wp=modelMatrix*vec4(position,1.); vWP=wp.xyz; vec4 mvPosition=viewMatrix*wp; gl_Position=projectionMatrix*mvPosition;
#include <fog_vertex>
}`;
const TERRAIN_FS = `uniform vec3 uAmb; uniform vec3 uMoonDir; uniform vec3 uMoon; uniform float uDet; varying vec3 vLight; varying vec3 vAlb; varying vec3 vN; varying vec3 vWP;
#include <fog_pars_fragment>
float h21(vec2 p){ return fract(sin(dot(p, vec2(127.1,311.7)))*43758.5453); }
float vn(vec2 p){ vec2 i=floor(p), f=fract(p); f=f*f*(3.-2.*f); return mix(mix(h21(i),h21(i+vec2(1.,0.)),f.x),mix(h21(i+vec2(0.,1.)),h21(i+vec2(1.,1.)),f.x),f.y); }
void main(){
  vec3 n=normalize(vN); float d=max(dot(n,uMoonDir),0.); float up=n.y*.5+.5;
  float det=vn(vWP.xz*.31+vWP.y*.07)*.5+vn(vWP.xz*1.6)*.3+vn(vWP.xz*.05)*.2;
  vec3 alb=vAlb*(1.-uDet*.5+det*uDet);
  vec3 c=alb*(uAmb*(.45+up*.85)+uMoon*d+vLight*1.6);
  gl_FragColor=vec4(c,1.);
  #include <fog_fragment>

Object.assign(Track, {
  // ---------------------------------------------------------------- theme: scene lights, fog, baked-light uniforms
  applyTheme() {

// car-vs-car contacts: two circles per car, mass-weighted push and impulse
function collideCars(cars, dt) {
  const R = 1.15;
  for (let a = 0; a < cars.length; a++) {
    const A = cars[a]; if (!A.alive || A.invT > 0) continue;
    for (let b = a + 1; b < cars.length; b++) {
      const B = cars[b]; if (!B.alive || B.invT > 0) continue;
      const dx0 = B.pos.x - A.pos.x, dz0 = B.pos.z - A.pos.z; if (dx0 * dx0 + dz0 * dz0 > 36) continue;
      if (Math.abs(A.y - B.y) > 2) continue;
      let best = null;
      for (const oa of [-1.15, 1.15]) for (const ob of [-1.15, 1.15]) {
        const ax = A.pos.x + Math.sin(A.th) * oa, az = A.pos.z + Math.cos(A.th) * oa, bx = B.pos.x + Math.sin(B.th) * ob, bz = B.pos.z + Math.cos(B.th) * ob;
        const dx = bx - ax, dz = bz - az, d = Math.hypot(dx, dz);
        if (d < 2 * R && (!best || d < best.d)) best = { d, dx, dz };
      }
      if (!best) continue;
      const d = best.d || 0.01, nx = best.dx / d, nz = best.dz / d, pen = 2 * R - d;
      const ma = A.mass, mb = B.mass, wa = mb / (ma + mb), wb = ma / (ma + mb);
      A.pos.x -= nx * pen * wa; A.pos.z -= nz * pen * wa; B.pos.x += nx * pen * wb; B.pos.z += nz * pen * wb;
      const rv = (B.vx - A.vx) * nx + (B.vz - A.vz) * nz;
      if (rv < 0) {
        const j = -(1.35) * rv / (1 / ma + 1 / mb);
        A.vx -= j * nx / ma; A.vz -= j * nz / ma; B.vx += j * nx / mb; B.vz += j * nz / mb;
        const imp = -rv;
        if (imp > 6) {
          A.yaw += (Math.random() - 0.5) * imp * 0.08; B.yaw += (Math.random() - 0.5) * imp * 0.08;
          if (imp > 14) { A.damage((imp - 14) * 0.9 / ma, B, 'ram'); B.damage((imp - 14) * 0.9 / mb, A, 'ram'); }
          onCarContact && onCarContact(A, B, imp, (A.pos.x + B.pos.x) / 2, Math.max(A.y, B.y), (A.pos.z + B.pos.z) / 2);
        }
      }
    }
  }
}

function wireInput() {
  const gameKeys = ['Space', 'KeyQ', 'Tab', 'ArrowUp', 'ArrowDown', 'ArrowLeft', 'ArrowRight', 'ShiftLeft', 'ShiftRight'];
  addEventListener('keydown', (e) => {
    Input.keys[e.code] = true; Input.lastDevice = 'kb';
    if (G.state === 'race' && gameKeys.includes(e.code)) e.preventDefault();
    if (e.repeat) return;
    if (e.code === 'Space' || e.code === 'KeyF' || e.code === 'Enter' && G.state === 'race') Input.press('fire');
    if (e.code === 'KeyQ' || e.code === 'KeyE') Input.press('back');
    if (e.code === 'Tab' || e.code === 'KeyR') Input.press('cycle');
    if (e.code === 'Escape' || e.code === 'KeyP') Game.togglePause();
    if (e.code === 'KeyM') { Sound.init(); Sound.setMuted(!Sound.isMuted()); Game.renderMute(); }
  });
  addEventListener('keyup', (e) => { Input.keys[e.code] = false; });
  addEventListener('blur', () => { Input.clear(); if (G.state === 'race') Game.pause(); });
  document.addEventListener('visibilitychange', () => { if (document.hidden && G.state === 'race') Game.pause(); });
  $('gl').addEventListener('mousedown', (e) => { if (G.state !== 'race') return; Sound.init(); if (e.button === 0) Input.press('fire'); else if (e.button === 2) Input.press('back'); });
  $('gl').addEventListener('contextmenu', (e) => e.preventDefault());
  // touch pads
  const hold = (id, key) => {
    const el = $(id);
    const on = (e) => { e.preventDefault(); Sound.init(); Input.lastDevice = 'touch'; el.classList.add('on'); try { el.setPointerCapture(e.pointerId); } catch (x) { } if (key === 'fire' || key === 'back') Input.press(key); else Input.touch[key] = true; };
    const off = (e) => { e.preventDefault(); el.classList.remove('on'); if (key !== 'fire' && key !== 'back') Input.touch[key] = false; };
    el.addEventListener('pointerdown', on); el.addEventListener('pointerup', off); el.addEventListener('pointercancel', off); el.addEventListener('lostpointercapture', off);
  };
  // steering pad: slide the thumb left/right for analogue steering
  (() => {
    const pad = $('steer'), knob = $('steerKnob'), cl = pad.querySelector('.ch.l'), cr = pad.querySelector('.ch.r');
    let pid = -1;
    const set = (e) => {
      const r = pad.getBoundingClientRect(), half = r.width / 2 - 26;
      let v = clamp(((e.clientX - r.left) - r.width / 2) / (half * 0.9), -1, 1);
      if (Math.abs(v) < 0.07) v = 0; else v = Math.sign(v) * Math.min(1, 0.12 + Math.abs(v) * 0.92);
      Input.touch.steer = v; knob.style.transform = `translateX(${v * half}px)`;
      cl.classList.toggle('hot', v < -0.15); cr.classList.toggle('hot', v > 0.15);
    };
    const end = () => { pid = -1; Input.touch.steer = 0; knob.style.transform = 'translateX(0)'; cl.classList.remove('hot'); cr.classList.remove('hot'); pad.classList.remove('on'); };
    pad.addEventListener('pointerdown', (e) => { e.preventDefault(); Sound.init(); Input.lastDevice = 'touch'; pid = e.pointerId; try { pad.setPointerCapture(pid); } catch (x) { } pad.classList.add('on'); set(e); });
    pad.addEventListener('pointermove', (e) => { if (e.pointerId === pid) { e.preventDefault(); set(e); } });
    for (const t of ['pointerup', 'pointercancel', 'lostpointercapture']) pad.addEventListener(t, (e) => { if (e.pointerId === pid) end(); });
  })();
  hold('tFire', 'fire'); hold('tBack', 'back'); hold('tDrift', 'drift'); hold('tBrake', 'brake');
  $('slots').addEventListener('pointerdown', (e) => { if (G.state === 'race') { e.preventDefault(); Input.press('cycle'); } });
  // menus
  $('playBtn').onclick = () => { Sound.init(); SFX.ui(); Game.events(); };
  $('garageBtn').onclick = () => { Sound.init(); SFX.ui(); Game.garage(true); };
  $('evBack').onclick = () => { SFX.ui(); Game.menu(); };
  $('gBack').onclick = () => { SFX.ui(); Game.garageFrom === 'menu' ? Game.menu() : Game.events(); };
  $('gGo').onclick = () => { if (Game.garageFrom === 'menu') { SFX.ui(); Game.menu(); } else Game.start(Game.evIdx); };
  $('toast').onclick = () => { $('toast').hidden = true; };
  $('resNext').onclick = () => { SFX.ui(); CG.midgame(() => Game.start(Game.evIdx + 1)); };
  $('resRetry').onclick = () => { SFX.ui(); CG.midgame(() => Game.start(Game.evIdx)); };
  $('resMenu').onclick = () => { SFX.ui(); Game.menu(); };
  $('pauseBtn').onclick = () => Game.pause();
  $('resumeBtn').onclick = () => { SFX.ui(); Game.resume(); };
  $('restartBtn').onclick = () => { SFX.ui(); G.paused = false; Game.start(Game.evIdx); };
  $('quitBtn').onclick = () => { SFX.ui(); G.paused = false; Game.menu(); };
  $('muteBtn').onclick = () => { Sound.init(); Sound.setMuted(!Sound.isMuted()); Game.renderMute(); };
}

// ---------------------------------------------------------------- main loop
const Perf = { acc: 0, n: 0, low: 0, sample(dt) { this.acc += dt; this.n++; if (this.acc > 2) { const fps = this.n / this.acc; if (fps < 38 && Q.dpr > 1) { Q.dpr = Math.max(1, Q.dpr - 0.25); resizeGfx(); } this.acc = 0; this.n = 0; } } };
function frame(dt) {
  if (GFX.timeU) GFX.timeU.value += dt;
  if (G.state === 'race' && !G.paused) {
    Race.update(dt);
    if (Race.state === 'race' && Cam.mode === 'intro') Cam.mode = 'chase';
    if (Race.state === 'countdown' && Cam.mode === 'intro' && Race.t > 0.2) Cam.mode = 'chase', Cam.snap(Race.player);
  } else if (G.state === 'results') {
    Race.update(dt);
  } else if (G.state === 'menu' && Game.show) {
    Game.show.frame(dt); CarFX.update([Game.show]);
    if (Items.slots.length) Items.updatePickups(dt, []);
  }
  if (!G.paused) FX.update(dt);
  Cam.update(dt);
  // post fx
  const cu = GFX.compMat.uniforms, P = Race.player;
  G.hurt = Math.max(0, G.hurt - dt * 1.8);
  const spK = P && G.state === 'race' ? clamp((P.fwdSpeed - 45) / 30, 0, 1) : 0;
  cu.speed.value = damp(cu.speed.value, spK * 0.8 + (P && P.boostT > 0 ? 0.6 : 0), 4, dt);
  cu.boost.value = damp(cu.boost.value, P && P.boostT > 0 ? 1 : 0, 6, dt);
  cu.hurt.value = G.hurt * 0.7; cu.time.value = (GFX.timeU ? GFX.timeU.value : 0) % 100;
  cu.aberr.value = G.hurt * 0.006;
  // audio
  if (P && G.state === 'race' && !G.paused) {
    const v = Math.abs(P.fwdSpeed), gears = [0, 16, 28, 40, 52, 64, 80, 120];
    let g = 1; while (g < gears.length - 1 && v > gears[g]) g++;
    const lo = gears[g - 1], hi = gears[g], rpm = clamp(0.22 + (v - lo) / (hi - lo) * 0.78, 0, 1);
    P.rpm = damp(P.rpm, Race.state === 'countdown' ? (P.ctl.thr > 0 || Input.read(_ctlTmp).thr > 0 ? 0.85 : 0.18) : rpm, 10, dt);
    Sound.engine(P.rpm, Race.state === 'countdown' ? Input.read(_ctlTmp).thr : P.ctl.thr, clamp(v / 70, 0, 1), P.alive, P.boostT > 0);
    Sound.skidding(P.alive && P.onGround ? clamp((P.drifting ? 0.8 : 0) + Math.max(0, Math.abs(P.yaw) * Math.abs(P.fwdSpeed) / 60 - 0.5), 0, 1) : 0);
    let nd = 1e9, nr = 0; for (const c of Race.cars) { if (c === P || !c.alive) continue; const d = c.pos.distanceTo(P.pos); if (d < nd) { nd = d; nr = clamp(Math.abs(c.fwdSpeed) / 70, 0, 1); } }
    Sound.rivalNear(0.3 + nr * 0.6, clamp(1 - nd / 30, 0, 1));
  } else if (G.state !== 'race') Sound.silence();
  renderFrame();
  drawOverlay(dt);
  if (G.state === 'race' && !G.paused) HUD.update();
}
function loop(now) {
  requestAnimationFrame(loop);
  const rdt = Math.min(0.05, Math.max(0, (now - G.last) / 1000)); G.last = now;
  if (G.freeze) { if (G.stillN > 2) return; renderFrame(); if (G.still) G.stillN = (G.stillN || 0) + 1; return; }
  Perf.sample(rdt);
  frame(rdt);
}

async function boot() {
  await CG.init(); CG.loadingStart();
  initGfx(); FX.init(); HUD.init(); Icons.init(); wireInput();
  // scene lights: moonlight, sky fill, a camera-side fill for the cars, one pooled point light in FX
  GFX.hemi = new THREE.HemisphereLight(0x6a5aa8, 0x120c18, 0.85); GFX.scene.add(GFX.hemi);
  const moon = GFX.moon = new THREE.DirectionalLight(0x9aa6ff, 0.75); moon.position.set(-40, 80, 45); GFX.scene.add(moon);
  const rim = GFX.rim = new THREE.DirectionalLight(0xff4fb0, 0.45); rim.position.set(50, 20, -60); GFX.scene.add(rim);
  Profile.load();
  await Assets.load(p => { $('loadBar').style.width = Math.round(p * 100) + '%'; });
  $('loadMsg').textContent = 'BUILDING THE CITY';
  Items.init(); CarFX.init();
  onCarContact = (A, B, imp, x, y, z) => {
    FX.sparkBurst(x, y + 0.6, z, Math.min(26, 6 + Math.round(imp)), 9, { r: 3, g: 2, b: 1 }, 0, 0, y);
    if (A === Race.player || B === Race.player) { SFX.crunch(Math.min(1, imp / 22)); Cam.shake(Math.min(0.6, imp * 0.03)); }
  };
  Game.lastTrack = 0;
  Game.menu();
  try { GFX.r.compile(GFX.scene, GFX.cam); } catch (e) { }
  renderFrame();
  CG.loadingStop();
  $('loading').hidden = true;
  G.last = performance.now();
  requestAnimationFrame(loop);
  window.__ready = true;
}
boot().catch((e) => { console.error(e); window.__err = String(e && e.stack || e); const l = $('loadMsg'); if (l) l.textContent = 'Could not load: ' + (e && e.message ? e.message : e); });

window.__RS = {
  THREE, G, Game, Race, AI, Track, TRACKS, EVENTS, CARS, Items, ITEMS, FX, Cam, GFX, Assets, Input, HUD, Car, CarFX, Q, Store, Sound, Profile, XP, TOURS,
  sim(n, dt = 1 / 60, each) { for (let i = 0; i < n; i++) { if (each) each(i); frame(dt); } },
  // physics only (no rendering): for fast headless tests
  step(n, dt = 1 / 60, each) { for (let i = 0; i < n; i++) { if (each) each(i); if (G.state === 'race' || G.state === 'results') Race.update(dt); FX.update(dt); if (Race.state === 'race' && Cam.mode !== 'chase') Cam.mode = 'chase'; Cam.update(dt); } },
};

</script>
